<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haven Countdown</title>
  <link rel="icon" href="favicon.png">
  <link rel="preload" href="assets/fonts/darumadrop-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <img id="bushes" src="assets/img/footer-bottom-bushes.webp" alt="" aria-hidden="true">

  <div id="stage">
    <div class="frame" aria-hidden="true"><i class="t"></i><i class="r"></i><i class="b"></i><i class="l"></i></div>
    <img class="logo" src="assets/img/logo.webp" alt="Hack Club Haven">

    <main class="center">
      <div class="digits" id="digits"></div>
      <div class="caption" id="caption"></div>
      <div class="ended-gallery" id="ended-gallery" aria-label="Haven memories">
        <figure><img src="1000095535.jpg" alt="Haven participants together"></figure>
        <figure><img src="IMG_0525.JPEG" alt="Hackers working together at Haven"></figure>
        <figure><img src="IMG_0530.JPEG" alt="Hackers sharing a moment at Haven"></figure>
        <figure><img src="IMG_9229.jpg" alt="A Haven group photo"></figure>
        <figure><img src="image (1).png" alt="Haven participants outside"></figure>
        <figure><img src="IMG_1894.jpg" alt="Haven participants receiving certificates"></figure>
        <figure><img src="image (2).png" alt="Haven hackers working together"></figure>
        <figure><img src="image (3).png" alt="Haven hackers collaborating"></figure>
        <figure><img src="wert.jpg" alt="Haven participants watching a presentation"></figure>
      </div>
    </main>

    <div class="marquee" id="marquee" hidden><div class="track" id="track"></div></div>

    <div class="sim" id="sim" hidden></div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="data/events.js"></script>
  <script src="app.js"></script>
</body>
</html>
